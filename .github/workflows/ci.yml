name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -e ".[dev,ocr]"
      - run: ruff check app eval data scripts tests
      - name: unit tests
        run: pytest tests/unit -q
      - name: integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/integration -q
      - name: eval gate (no unsafe auto-approvals on a fresh split)
        env:
          OCR_BACKEND: tesseract
        run: |
          python -m data.generate --out data/generated --split ci --seed 11 --n-clean 40 --n-scanned 10 --n-per-error 4
          python -m eval.run_eval --split data/generated/ci --baselines --max-wrong-approvals 0

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd ui && npm install --no-audit --no-fund && npm run build
