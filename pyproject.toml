[project]
name = "ap-agent"
version = "0.1.0"
description = "Accounts-payable three-way match agent with human review, transactional outbox and offline evaluation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "reportlab>=4.2",
    "pillow>=10.3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "boto3>=1.34",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "anthropic>=0.60",
    "openai>=1.40",
    "PyJWT[crypto]>=2.9,<3.0",
]

[project.optional-dependencies]
docling = ["docling>=2.0"]
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (DATABASE_URL / ADMIN_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults
