
# LedgerGuard local development stack.
# PostgreSQL, MinIO, API, worker, mock AP and React UI.

x-app-env: &app-env
  DATABASE_URL: postgresql://ap_app:ap_app@postgres:5432/apagent
  ADMIN_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apagent

  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: ap-documents

  AP_API_URL: http://mock-ap:8001
  AP_API_TOKEN: dev-ap-token

  AP_PROVIDER: ${AP_PROVIDER:-mock}
  SHADOW_MODE: ${SHADOW_MODE:-false}

  QBO_COMPANY_ID: ${QBO_COMPANY_ID:-}
  QBO_ACCESS_TOKEN: ${QBO_ACCESS_TOKEN:-}
  QBO_TENANT_SLUG: ${QBO_TENANT_SLUG:-acme}
  QBO_VENDOR_ID: ${QBO_VENDOR_ID:-}
  QBO_VENDOR_NAME: ${QBO_VENDOR_NAME:-}
  QBO_EXPENSE_ACCOUNT_ID: ${QBO_EXPENSE_ACCOUNT_ID:-}

  OCR_BACKEND: tesseract

  EXTRACTOR: ${EXTRACTOR:-rules}
  SECONDARY_EXTRACTOR: ${SECONDARY_EXTRACTOR:-rules_alt}

  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}

  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}

  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

  CORS_ORIGINS: http://localhost:5173

services:

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apagent

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d apagent
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - miniodata:/data

  migrate:
    build: .

    user: "0:0"

    environment: *app-env

    command: >
      sh -c "python -m scripts.init_db &&
             python -m scripts.seed"

    volumes:
      - ./data/generated:/app/data/generated

    depends_on:
      postgres:
        condition: service_healthy

  mock-ap:
    build: .

    environment:
      MOCK_AP_TOKEN: dev-ap-token

    command: >
      uvicorn app.mock_ap.server:app
      --host 0.0.0.0
      --port 8001

    ports:
      - "8001:8001"

  api:
    build: .

    environment: *app-env

    ports:
      - "8000:8000"

    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started

  worker:
    build: .

    environment: *app-env

    command: python -m app.worker.main

    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      mock-ap:
        condition: service_started

  ui:
    image: node:22-alpine

    working_dir: /ui

    command: >
      sh -c "npm install --no-audit --no-fund &&
             npm run dev -- --host 0.0.0.0"

    environment:
      VITE_API_URL: http://localhost:8000

    ports:
      - "5173:5173"

    volumes:
      - ./ui:/ui
      - /ui/node_modules

volumes:
  pgdata:
  miniodata:
